<!DOCTYPE html>
<html>
<head>
    <title>Pay via M-Pesa</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 75vw;
            max-width: 500px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }

        h2 {
            margin-bottom: 5px;
            font-size: 26px;
        }

        h4 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: normal;
            color: #666;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        /* Added styling to make the amount input field background black */
        .amount-input {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #000000;
            font-weight: bold;
        }

        /* Keeps the text white when typing or clicking into the box */
        .amount-input::placeholder {
            color: #aaaaaa;
        }

        button {
            width: 100%;
            padding: 14px;
            background: green;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            box-sizing: border-box;
        }

        button:hover {
            background: darkgreen;
        }

        .msg {
            margin-top: 12px;
            font-size: 15px;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Jisort Stima!</h1>
    <h2>Ni Rahisi Na Haraka</h2>
    

    <!-- Phone input -->
    <input type="text" id="phone" placeholder="Enter phone e.g. 0712345678">
    
    <!-- Changed from type="hidden" to type="number" and added the black styling class -->
    <input type="number" id="amount" class="amount-input" placeholder="Enter Amount (KES)" min="1">

    <button onclick="pay()">Pay Now</button>

    <div class="msg" id="msg"></div>
</div>

<script>
function formatPhone(phone) {
    phone = phone.trim();

    // Convert 07xxxxxxxx → 2547xxxxxxxx
    if (phone.startsWith("0")) {
        phone = "254" + phone.substring(1);
    }

    return phone;
}

async function pay() {
    let phoneInput = document.getElementById("phone").value;
    let amount = document.getElementById("amount").value;
    let msg = document.getElementById("msg");

    // Check if phone number is provided
    if (!phoneInput) {
        msg.style.color = "red";
        msg.innerText = "Please enter phone number";
        return;
    }

    // Check if amount is provided and is valid
    if (!amount || amount <= 0) {
        msg.style.color = "red";
        msg.innerText = "Please enter a valid amount";
        return;
    }

    let phone = formatPhone(phoneInput);

    msg.style.color = "black";
    msg.innerText = "📲 Sending STK request...";

    try {
        let res = await fetch("/stkpush", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                phone: phone,
                amount: amount
            })
        });

        let data = await res.json();

        if (data.ResponseCode === "0") {
            msg.innerText = "✅ STK sent! Check your phone and enter PIN.";
        } else {
            msg.innerText = "❌ Payment failed. Try again.";
        }

    } catch (err) {
        msg.innerText = "⚠️ Server error. Try again.";
    }
}
</script>

</body>
</html>
