<!DOCTYPE html>
<html>
<head>
    <title>Pay via M-Pesa</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 75vw;
            max-width: 500px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            color: #333;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: normal;
            color: #666;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        /* Black input fields styling */
        .black-input {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #000000;
            font-weight: bold;
        }

        .black-input::placeholder {
            color: #aaaaaa;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #1b8a5a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-sizing: border-box;
            margin-top: 10px;
        }

        button:hover {
            background: #115738;
        }

        .msg {
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>Jisort Stima!</h1>
    <h2>Ni Rahisi Na Haraka</h2>
    
    <!-- Phone input -->
    <input type="tel" id="phone" placeholder="Enter Safaricom Phone (e.g. 0712345678)">
    
    <!-- Meter/Account Input -->
    <input type="text" id="account" class="black-input" placeholder="Enter KPLC Meter / Account No">

    <!-- Amount Input -->
    <input type="number" id="amount" class="black-input" placeholder="Enter Amount (KES)" min="1">

    <button onclick="pay()">Pay Now</button>

    <div class="msg" id="msg"></div>
</div>

<script>
function validateAndFormatPhone(phone) {
    phone = phone.trim().replace(/\s+/g, ''); // Remove spaces

    // Convert 07... or 01... to 254...
    if (phone.startsWith("0")) {
        phone = "254" + phone.substring(1);
    } else if (phone.startsWith("+254")) {
        phone = phone.substring(1);
    }

    // Safaricom specific format validation regex
    const safaricomRegex = /^(254)(7[0-1-2-4-5-6-9]|1[1-2-3-4-5])\d{7}$/;
    
    return safaricomRegex.test(phone) ? phone : null;
}

async function pay() {
    let phoneInput = document.getElementById("phone").value;
    let accountInput = document.getElementById("account").value.trim();
    let amount = document.getElementById("amount").value;
    let msg = document.getElementById("msg");

    // Clear previous styles
    msg.style.color = "initial";

    // 1. Phone validation
    let phone = validateAndFormatPhone(phoneInput);
    if (!phone) {
        msg.style.color = "red";
        msg.innerText = "❌ Please enter a valid Safaricom phone number.";
        return;
    }

    // 2. Account/Meter validation
    if (!accountInput) {
        msg.style.color = "red";
        msg.innerText = "❌ Please enter your Meter or Account number.";
        return;
    }

    // 3. Amount validation
    if (!amount || amount <= 0) {
        msg.style.color = "red";
        msg.innerText = "❌ Please enter a valid amount.";
        return;
    }

    msg.style.color = "#333";
    msg.innerText = "📲 Sending STK request to your phone...";

    try {
        let res = await fetch("/stkpush", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                phone: phone,
                amount: amount,
                account: accountInput // Pass the account info to your backend
            })
        });

        let data = await res.json();

        if (data.ResponseCode === "0") {
            msg.style.color = "green";
            msg.innerText = "✅ STK push sent! Check your phone, enter your M-Pesa PIN, and wait for confirmation.";
            
            // Pro-tip: You can trigger a function here to poll your backend for payment confirmation status.
        } else {
            msg.style.color = "red";
            msg.innerText = "❌ Request failed. Please check your phone status and try again.";
        }

    } catch (err) {
        msg.style.color = "red";
        msg.innerText = "⚠️ Server connection error. Try again.";
    }
}
</script>

</body>
</html>
