<!DOCTYPE html>
<html>
<head>
    <title>Membership Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 75vw;
            max-width: 500px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #333;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 15px;
            font-weight: normal;
            color: #666;
            text-align: center;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #444;
            display: block;
            margin-top: 10px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .fee-display {
            background-color: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed #1b8a5a;
            text-align: center;
            font-weight: bold;
            color: #1b8a5a;
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #1b8a5a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-sizing: border-box;
            margin-top: 10px;
        }

        button:hover {
            background: #115738;
        }

        .msg {
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Member Registration</h1>
    <h2>Complete your details to activate your account</h2>
    
    <!-- User Details Section -->
    <label for="fullName">Full Name</label>
    <input type="text" id="fullName" placeholder="Enter your full name">

    <label for="age">Age</label>
    <input type="number" id="age" min="18" max="100" placeholder="Enter your age">

    <label for="country">Country</label>
    <select id="country">
        <option value="">Select your country</option>
        <option value="Kenya">Kenya</option>
        <option value="Uganda">Uganda</option>
        <option value="Tanzania">Tanzania</option>
        <option value="Other">Other</option>
    </select>

    <label for="phone">Safaricom Phone Number</label>
    <input type="tel" id="phone" placeholder="e.g. 0712345678">
    
    <!-- Fixed Activation Fee Display -->
    <div class="fee-display">
        One-Time Activation Fee: KES 100
    </div>

    <button onclick="payAndRegister()">Pay & Register</button>

    <div class="msg" id="msg"></div>
</div>

<script>
function validateAndFormatPhone(phone) {
    phone = phone.trim().replace(/\s+/g, '');

    if (phone.startsWith("0")) {
        phone = "254" + phone.substring(1);
    } else if (phone.startsWith("+254")) {
        phone = phone.substring(1);
    }

    const safaricomRegex = /^(254)(7[0-1-2-4-5-6-9]|1[1-2-3-4-5])\d{7}$/;
    return safaricomRegex.test(phone) ? phone : null;
}

async function payAndRegister() {
    let fullName = document.getElementById("fullName").value.trim();
    let age = document.getElementById("age").value;
    let country = document.getElementById("country").value;
    let phoneInput = document.getElementById("phone").value;
    let msg = document.getElementById("msg");
    
    const fixedAmount = 100; // Enforced programmatic fee

    msg.style.color = "initial";
    msg.innerText = "";

    // 1. Input Validation
    if (!fullName) {
        msg.style.color = "red";
        msg.innerText = "❌ Please enter your full name.";
        return;
    }

    if (!age || age < 18) {
        msg.style.color = "red";
        msg.innerText = "❌ You must be 18 years or older to register.";
        return;
    }

    if (!country) {
        msg.style.color = "red";
        msg.innerText = "❌ Please select your country.";
        return;
    }

    let phone = validateAndFormatPhone(phoneInput);
    if (!phone) {
        msg.style.color = "red";
        msg.innerText = "❌ Please enter a valid Safaricom phone number.";
        return;
    }

    msg.style.color = "#333";
    msg.innerText = "📲 Sending STK request to your phone...";

    try {
        let res = await fetch("/stkpush", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                phone: phone,
                amount: fixedAmount,
                metadata: {
                    fullName: fullName,
                    age: age,
                    country: country
                }
            })
        });

        let data = await res.json();

        if (data.ResponseCode === "0") {
            msg.style.color = "green";
            msg.innerText = "✅ STK push sent! Check your phone to complete registration.";
        } else {
            msg.style.color = "red";
            msg.innerText = "❌ Request failed. Please try again.";
        }

    } catch (err) {
        msg.style.color = "red";
        msg.innerText = "⚠️ Server connection error. Try again.";
    }
}
</script>

</body>
</html>
