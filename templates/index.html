<!DOCTYPE html>
<html>
<head>
    <title>Pay via M-Pesa</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 75vw;
            max-width: 500px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h2 {
            margin-bottom: 5px;
            font-size: 26px;
        }

        h4 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: normal;
            color: #666;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: green;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: darkgreen;
        }

        .msg {
            margin-top: 12px;
            font-size: 15px;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Pay KES 100</h2>
    <h4>Enter your phone number to receive M-Pesa prompt</h4>

    <input type="text" id="phone" placeholder="Enter phone e.g. 0712345678">
    <input type="hidden" id="amount" value="100">

    <button onclick="pay()">Pay Now</button>

    <div class="msg" id="msg"></div>
</div>

<script>
function formatPhone(phone) {
    phone = phone.trim();

    // Convert 07xxxxxxxx → 2547xxxxxxxx
    if (phone.startsWith("0")) {
        phone = "254" + phone.substring(1);
    }

    return phone;
}

async function pay() {
    let phoneInput = document.getElementById("phone").value;
    let amount = document.getElementById("amount").value;
    let msg = document.getElementById("msg");

    if (!phoneInput) {
        msg.innerText = "Please enter phone number";
        return;
    }

    let phone = formatPhone(phoneInput);

    msg.innerText = "📲 Sending STK request...";

    try {
        let res = await fetch("/stkpush", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                phone: phone,
                amount: amount
            })
        });

        let data = await res.json();

        if (data.ResponseCode === "0") {
            msg.innerText = "✅ STK sent! Check your phone and enter PIN.";
        } else {
            msg.innerText = "❌ Payment failed. Try again.";
        }

    } catch (err) {
        msg.innerText = "⚠️ Server error. Try again.";
    }
}
</script>

</body>
</html>
