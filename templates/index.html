<!DOCTYPE html>
<html>
<head>
    <title>Uta-vote nani 2027?</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #87ceeb; /* Sky blue website background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: linear-gradient(135deg, #006633 0%, #000000 100%);
            padding: 0 0 30px 0; 
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); 
            box-sizing: border-box;
            transition: all 0.3s ease;
            overflow: hidden; 
        }

        .header-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            object-position: center;
            display: block;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .card-content {
            padding: 0 30px;
        }

        h1 {
            font-size: 26px;
            margin: 0 0 5px 0;
            color: #ffffff; 
            text-align: center;
        }

        h2 {
            margin: 0 0 25px 0;
            font-size: 14px;
            font-weight: normal;
            color: #dddddd; 
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #bbbbbb; 
            margin: 20px 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2); 
            font-weight: bold;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            color: #ffffff; 
            display: block;
            margin-top: 12px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px 0;
            border: 1px solid #ccc; 
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #ffffff;
        }

        input:focus, select:focus {
            border-color: #fdd835; 
            outline: none;
            box-shadow: 0 0 5px rgba(253, 216, 53, 0.5);
        }

        .aesthetic-input {
            border: 1px solid #ddd;
            background-color: #fdfdfd; 
        }

        .candidate-container {
            display: flex;
            gap: 15px;
            margin: 10px 0 20px 0;
        }

        .candidate-card {
            flex: 1;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
            font-weight: bold;
        }

        .candidate-card input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            margin: 0;
        }

        .card-wantam {
            color: #4ade80; 
            background-color: rgba(0, 102, 51, 0.4);
        }

        .card-wantam:hover {
            border-color: #4ade80;
        }

        .candidate-card.selected-wantam {
            border-color: #4ade80;
            background-color: #2e7d32;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.5);
        }

        .card-tutam {
            color: #fde047; 
            background-color: rgba(183, 149, 0, 0.2);
        }

        .card-tutam:hover {
            border-color: #fde047;
        }

        .candidate-card.selected-tutam {
            border-color: #fdd835;
            background-color: #fdd835;
            color: #000000;
            box-shadow: 0 4px 12px rgba(253, 216, 53, 0.5);
        }

        .candidate-name {
            font-size: 18px;
            display: block;
            margin-bottom: 4px;
        }

        .candidate-party {
            font-size: 11px;
            text-transform: uppercase;
            opacity: 0.9;
            display: block;
        }

        .checkbox-container {
            display: flex;
            align-items: flex-start;
            margin: 15px 0;
            cursor: pointer;
            font-size: 13px;
            color: #eeeeee; 
            line-height: 1.4;
        }

        .checkbox-container input {
            width: auto;
            margin: 3px 10px 0 0;
            flex-shrink: 0;
        }

        .fee-display {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed #ffffff;
            text-align: center;
            font-weight: bold;
            color: #ffffff;
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #ffffff; 
            color: #000000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-sizing: border-box;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #fdd835; 
        }

        button:disabled {
            background: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
            color: #888888;
        }

        .error-msg {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            color: #ff4d4d; 
        }

        .hidden {
            display: none !important;
        }

        .success-state {
            text-align: center;
            padding: 20px 30px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid #ffffff;
            border-radius: 50%;
            margin: 20px auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-title {
            font-size: 20px;
            color: #4ade80;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .status-desc {
            font-size: 14px;
            color: #ffffff;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="card" id="pollCard">
    <img src="https://githubusercontent.com" alt="Header Banner" class="header-image">

    <div class="card-content">
        <div id="formView">
            <h1>WANTAM vs TUTAM</h1>
            <h2>Uko Wantam ama Tutam?</h2>
            
            <div class="section-title">1. Chagua Kura Yako</div>
            
            <div class="candidate-container">
                <label class="candidate-card card-wantam" id="labelWantam">
                    <input type="radio" name="candidate" value="WANTAM" onclick="selectCandidate('WANTAM')">
                    <span class="candidate-name">WANTAM</span>
                    <span class="candidate-party">Green Team</span>
                </label>
                
                <label class="candidate-card card-tutam" id="labelTutam">
                    <input type="radio" name="candidate" value="TUTAM" onclick="selectCandidate('TUTAM')">
                    <span class="candidate-name">TUTAM</span>
                    <span class="candidate-party">Yellow Team</span>
                </label>
            </div>

            <!-- Aesthetic Display Boxes -->
            <label for="aestheticName">Your Name (Optional)</label>
            <input type="text" id="aestheticName" class="aesthetic-input" placeholder="Type your name here...">

            <label for="aestheticCounty">County</label>
            <input type="text" id="aestheticCounty" class="aesthetic-input" placeholder="e.g., Nairobi, Mombasa...">

            <div class="section-title">2. Functional Registration & Checkout</div>

            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name">

            <label for="age">Age</label>
            <input type="number" id="age" min="18" max="100" placeholder="Enter your age">

            <label for="country">Country</label>
            <select id="country">
                <option value="">Select your country</option>
                <option value="Kenya">Kenya</option>
                <option value="Uganda">Uganda</option>
                <option value="Tanzania">Tanzania</option>
                <option value="Other">Other</option>
            </select>

            <label for="phone">Safaricom Phone Number</label>
            <input type="tel" id="phone" placeholder="e.g. 0712345678">
            
            <label class="checkbox-container">
                <input type="checkbox" id="privacyCheck" onclick="toggleVoteButton()">
                Ninakubali Masharti na Vigezo. I agree to the privacy statement and consent to processing my registration data to cast this vote.
            </label>

            <div class="fee-display">
                Gharama ya Kupiga Kura: KES 10
            </div>

            <button id="voteBtn" onclick="payAndVote()" disabled>Cast Vote (KES 10)</button>
            <div class="error-msg" id="errorMsg"></div>
        </div>

        <div id="successView" class="hidden success-state">
            <div class="spinner"></div>
            <div class="status-title">📲 Angalia Simu Yako!</div>
